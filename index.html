<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Birthday Secret</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <!-- =====================================================
         MAIN ENTRY PAGE
    ====================================================== -->

    <main class="entry-page">


        <!-- =================================================
             LEFT PANEL - YOUR PHOTO
        ================================================== -->

        <section class="entry-panel photo-panel">


            <div class="photo-frame">

                <!--
                    YOUR PHOTO

                    Keep your image in the same folder
                    as index.html.

                    Current filename:
                    EntryImg.jpg

                    If your actual file is PNG,
                    change .jpg to .png.
                -->

                <img
                    src="EntryImg.jpg"
                    alt="Entry Image"
                    class="entry-photo"
                >

            </div>


            <!-- SAME FONT + SAME SIZE -->

            <div class="intimidating-dialogue">

                <div>
                    ABEY OH CHIRKOOT!!
                </div>

                <div>
                    PASSWORD DAAL
                </div>

            </div>


        </section>



        <!-- =================================================
             RIGHT PANEL - PASSWORD
        ================================================== -->

        <section class="entry-panel password-panel">


            <div class="password-content">


                <div class="lock-icon">
                    🔐
                </div>


                <div class="classified">
                    CLASSIFIED ACCESS
                </div>


                <h2>
                    BIRTHDAY<br>
                    VAULT
                </h2>


                <p class="instruction">
                    Enter the secret password
                </p>



                <!-- =================================================
                     PASSWORD DISPLAY
                ================================================== -->

                <div
                    id="password-display"
                    class="password-display"
                >

                    <span id="password-dots">
                        ENTER PASSWORD
                    </span>

                </div>



                <!-- =================================================
                     NUMERIC KEYPAD
                ================================================== -->

                <div class="keypad">


                    <button
                        type="button"
                        onclick="addDigit('1')"
                    >
                        1
                    </button>


                    <button
                        type="button"
                        onclick="addDigit('2')"
                    >
                        2
                    </button>


                    <button
                        type="button"
                        onclick="addDigit('3')"
                    >
                        3
                    </button>


                    <button
                        type="button"
                        onclick="addDigit('4')"
                    >
                        4
                    </button>


                    <button
                        type="button"
                        onclick="addDigit('5')"
                    >
                        5
                    </button>


                    <button
                        type="button"
                        onclick="addDigit('6')"
                    >
                        6
                    </button>


                    <button
                        type="button"
                        onclick="addDigit('7')"
                    >
                        7
                    </button>


                    <button
                        type="button"
                        onclick="addDigit('8')"
                    >
                        8
                    </button>


                    <button
                        type="button"
                        onclick="addDigit('9')"
                    >
                        9
                    </button>


                    <button
                        type="button"
                        class="control-button"
                        onclick="clearPassword()"
                    >
                        CLEAR
                    </button>


                    <button
                        type="button"
                        onclick="addDigit('0')"
                    >
                        0
                    </button>


                    <button
                        type="button"
                        class="control-button"
                        onclick="removeDigit()"
                    >
                        ←
                    </button>


                </div>



                <!-- =================================================
                     ENTER BUTTON
                ================================================== -->

                <button
                    type="button"
                    class="unlock-button"
                    onclick="checkPassword()"
                >
                    ENTER
                </button>


                <div
                    id="password-message"
                    class="password-message"
                ></div>


            </div>


        </section>


    </main>



    <!-- =====================================================
         WRONG PASSWORD POPUP
    ====================================================== -->

    <div
        id="meme-popup"
        class="popup"
    >

        <div class="popup-card">


            <!-- TOP LEFT CLOSE BUTTON -->

            <button
                type="button"
                class="popup-close"
                onclick="closeMeme()"
            >
                ×
            </button>


            <div class="popup-label">
                ACCESS DENIED
            </div>


            <h2>
                ABEY SAALE!
            </h2>


            <!--
                YOUR MEME

                File:
                AbeySaale.jpg

                Keep it beside index.html.
            -->

            <img
                src="AbeySaale.jpg"
                alt="Wrong password meme"
                class="meme-image"
            >


        </div>

    </div>



    <!-- =====================================================
         WELCOME VIDEO POPUP
    ====================================================== -->

    <div
        id="welcome-popup"
        class="popup"
    >

        <div class="popup-card">


            <!-- TOP LEFT CLOSE BUTTON -->

            <button
                type="button"
                class="popup-close"
                onclick="closeWelcomeVideo()"
            >
                ×
            </button>


            <div class="popup-label">
                ACCESS GRANTED
            </div>


            <h2>
                WELCOME.
            </h2>


            <p>
                You know the password.
            </p>


            <!--
                YOUR WELCOME VIDEO

                File:
                welcome.mp4

                Keep it beside index.html.
            -->

            <video
                id="welcome-video"
                class="welcome-video"
                controls
                playsinline
            >

                <source
                    src="welcome.mp4"
                    type="video/mp4"
                >

            </video>


            <button
                type="button"
                class="continue-button"
                onclick="closeWelcomeVideo()"
            >
                CONTINUE
            </button>


        </div>

    </div>



    <script src="script.js"></script>

</body>

</html>
