<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>🎂 Birthday Secret</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =================================================
         FIRST PAGE
         PASSWORD ENTRY SCREEN
    ================================================== -->

    <main class="entry-page">

        <!-- LEFT SIDE : PHOTO -->

        <section class="photo-section">

            <!--
                YOUR PHOTO GOES HERE

                Current file:
                media/EntryImg.jpg

                If your image is PNG, change .jpg to .png
            -->

            <div class="photo-frame">

                <img
                    src="media/EntryImg.jpg"
                    alt="My Photo"
                >

            </div>

            <h1>
                Abey oh Chirkoot!! 😤
            </h1>

            <p>
                Password Daal 🔐
            </p>

        </section>


        <!-- RIGHT SIDE : PASSWORD -->

        <section class="password-section">

            <div class="password-card">

                <div class="lock">
                    🔐
                </div>

                <p class="small-heading">
                    CLASSIFIED ACCESS
                </p>

                <h2>
                    Enter The Secret Password
                </h2>

                <p class="instruction">
                    Only the chosen one can enter 👀
                </p>


                <!-- PASSWORD DISPLAY -->

                <div
                    id="password-display"
                    class="password-display"
                >
                    _
                </div>


                <!-- NUMERIC KEYPAD -->

                <div class="keypad">

                    <button onclick="pressKey('1')">1</button>
                    <button onclick="pressKey('2')">2</button>
                    <button onclick="pressKey('3')">3</button>

                    <button onclick="pressKey('4')">4</button>
                    <button onclick="pressKey('5')">5</button>
                    <button onclick="pressKey('6')">6</button>

                    <button onclick="pressKey('7')">7</button>
                    <button onclick="pressKey('8')">8</button>
                    <button onclick="pressKey('9')">9</button>

                    <button onclick="clearPassword()">C</button>
                    <button onclick="pressKey('0')">0</button>
                    <button onclick="checkPassword()">✓</button>

                </div>

            </div>

        </section>

    </main>


    <!-- =================================================
         WRONG PASSWORD MEME
    ================================================== -->

    <div
        id="meme-popup"
        class="meme-popup"
    >

        <div class="meme-box">

            <!--
                YOUR MEME GOES HERE

                Current file:
                media/AbeySaale.jpg

                If your meme is PNG,
                change .jpg to .png
            -->

            <img
                src="media/AbeySaale.jpg"
                alt="Abey Saale Meme"
            >

            <button onclick="closeMeme()">
                ✕ CUT IT 😂
            </button>

        </div>

    </div>


    <!-- =================================================
         WELCOME VIDEO
    ================================================== -->

    <div
        id="welcome-popup"
        class="welcome-popup"
    >

        <div class="welcome-box">

            <h2>
                🎉 ACCESS GRANTED!
            </h2>

            <p>
                Welcome, Chirkoot. 😂
            </p>

            <!--
                FOR NOW WE USE A PLACEHOLDER VIDEO.

                Later you can put your own video inside
                the media folder and change the source to:

                media/welcome.mp4
            -->

            <video
                id="welcome-video"
                controls
                playsinline
            >

                <source
                    src="media/welcome.mp4"
                    type="video/mp4"
                >

                Your browser does not support video.

            </video>

            <button onclick="continueToNextPage()">
                🎀 CONTINUE
            </button>

        </div>

    </div>


    <!-- =================================================
         FIRST PAGE JAVASCRIPT
    ================================================== -->

    <script>

        /* ================================================
           SECRET PASSWORD
        ================================================ */

        const correctPassword = "03092005";


        let enteredPassword = "";


        /* ================================================
           NUMBER BUTTON
        ================================================ */

        function pressKey(number) {

            if (enteredPassword.length >= 8) {
                return;
            }

            enteredPassword += number;

            updateDisplay();
        }


        /* ================================================
           DISPLAY PASSWORD
        ================================================ */

        function updateDisplay() {

            const display =
                document.getElementById(
                    "password-display"
                );

            if (enteredPassword.length === 0) {

                display.textContent = "_";

                return;
            }


            display.textContent =
                "•".repeat(
                    enteredPassword.length
                );
        }


        /* ================================================
           CLEAR PASSWORD
        ================================================ */

        function clearPassword() {

            enteredPassword = "";

            updateDisplay();
        }


        /* ================================================
           CHECK PASSWORD
        ================================================ */

        function checkPassword() {

            if (
                enteredPassword ===
                correctPassword
            ) {

                openWelcomeVideo();

            }

            else {

                showWrongPassword();

            }
        }


        /* ================================================
           WRONG PASSWORD
        ================================================ */

        function showWrongPassword() {

            const popup =
                document.getElementById(
                    "meme-popup"
                );

            popup.classList.add("show");

            enteredPassword = "";

            updateDisplay();
        }


        /* ================================================
           CLOSE MEME
        ================================================ */

        function closeMeme() {

            document
                .getElementById(
                    "meme-popup"
                )
                .classList.remove("show");
        }


        /* ================================================
           CORRECT PASSWORD
        ================================================ */

        function openWelcomeVideo() {

            const popup =
                document.getElementById(
                    "welcome-popup"
                );

            const video =
                document.getElementById(
                    "welcome-video"
                );


            popup.classList.add("show");


            /*
                Try to play the video
                automatically.

                Because the user has just
                clicked the password button,
                most browsers will allow sound.
            */

            video.currentTime = 0;

            video.play()
                .catch(() => {

                    console.log(
                        "Video autoplay was blocked."
                    );

                });
        }


        /* ================================================
           NEXT PAGE

           FOR NOW THIS JUST SHOWS A MESSAGE.

           Later we will connect this to your
           actual Birthday Adventure page.
        ================================================ */

        function continueToNextPage() {

            alert(
                "🎉 Page 1 complete! Next page coming soon."
            );
        }


        /* ================================================
           KEYBOARD SUPPORT

           You can also type numbers from your keyboard.
        ================================================ */

        document.addEventListener(
            "keydown",
            function(event) {

                if (
                    event.key >= "0" &&
                    event.key <= "9"
                ) {

                    pressKey(event.key);

                }


                if (event.key === "Enter") {

                    checkPassword();

                }


                if (
                    event.key === "Backspace" ||
                    event.key === "Escape"
                ) {

                    clearPassword();

                }

            }
        );

    </script>

</body>

</html>
