<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>🎂 Birthday Secret</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =====================================================
         PREMIUM BATMAN-STYLE BACKGROUND
    ====================================================== -->

    <div class="bat-symbol">
        🦇
    </div>

    <div class="background-glow glow-one"></div>
    <div class="background-glow glow-two"></div>


    <!-- =====================================================
         MAIN ENTRY PAGE
    ====================================================== -->

    <main class="entry-page">

        <!-- =================================================
             LEFT SIDE - YOUR PHOTO
        ================================================== -->

        <section class="photo-section">

            <div class="photo-frame">

                <!--
                    YOUR IMAGE

                    Your file should be named:
                    EntryImg.jpg

                    If your file is PNG, change .jpg to .png
                -->

                <img
                    src="EntryImg.jpg"
                    alt="Birthday Boy"
                    class="entry-photo"
                >

                <div class="frame-shine"></div>

            </div>


            <div class="photo-caption">

                <div class="caption-line"></div>

                <h1>
                    Abey oh Chirkoot!!
                </h1>

                <p>
                    Password Daal 🔐
                </p>

                <div class="caption-line"></div>

            </div>

        </section>



        <!-- =================================================
             RIGHT SIDE - PASSWORD PANEL
        ================================================== -->

        <section class="password-section">

            <div class="password-card">

                <div class="security-icon">
                    🔐
                </div>

                <div class="classified">
                    CLASSIFIED ACCESS
                </div>

                <h2>
                    Welcome to<br>
                    the Birthday Vault
                </h2>

                <p class="subtitle">
                    Only the chosen one can enter.
                </p>


                <!-- PASSWORD DISPLAY -->

                <div
                    id="password-display"
                    class="password-display"
                >
                    <span id="password-dots">
                        Enter Password
                    </span>
                </div>


                <!-- NUMERIC KEYPAD -->

                <div class="keypad">

                    <button onclick="addDigit('1')">1</button>
                    <button onclick="addDigit('2')">2</button>
                    <button onclick="addDigit('3')">3</button>

                    <button onclick="addDigit('4')">4</button>
                    <button onclick="addDigit('5')">5</button>
                    <button onclick="addDigit('6')">6</button>

                    <button onclick="addDigit('7')">7</button>
                    <button onclick="addDigit('8')">8</button>
                    <button onclick="addDigit('9')">9</button>

                    <button
                        class="clear-key"
                        onclick="clearPassword()"
                    >
                        C
                    </button>

                    <button onclick="addDigit('0')">
                        0
                    </button>

                    <button
                        class="back-key"
                        onclick="removeDigit()"
                    >
                        ←
                    </button>

                </div>


                <!-- UNLOCK BUTTON -->

                <button
                    class="unlock-button"
                    onclick="checkPassword()"
                >
                    🔓 ENTER THE VAULT
                </button>


                <p
                    id="password-message"
                    class="password-message"
                ></p>


                <div class="vault-footer">
                    BIRTHDAY SECURITY SYSTEM • 2005
                </div>

            </div>

        </section>

    </main>



    <!-- =====================================================
         WRONG PASSWORD MEME POPUP
    ====================================================== -->

    <div
        id="meme-popup"
        class="popup"
    >

        <div class="popup-card meme-card">

            <!-- CLOSE BUTTON - TOP LEFT -->

            <button
                class="popup-close"
                onclick="closeMeme()"
            >
                ×
            </button>


            <div class="popup-label">
                ACCESS DENIED
            </div>

            <h2>
                ABEY SAALE! 😂
            </h2>


            <!--
                YOUR MEME

                Put your meme in the same folder as this
                HTML file.

                File name:
                AbeySaale.jpg

                If PNG, change to AbeySaale.png
            -->

            <img
                src="AbeySaale.jpg"
                alt="Wrong password meme"
                class="meme-image"
            >

        </div>

    </div>



    <!-- =====================================================
         WELCOME VIDEO POPUP
    ====================================================== -->

    <div
        id="welcome-popup"
        class="popup"
    >

        <div class="popup-card video-card">

            <!-- CLOSE BUTTON - TOP LEFT -->

            <button
                class="popup-close"
                onclick="closeWelcomeVideo()"
            >
                ×
            </button>


            <div class="popup-label">
                ACCESS GRANTED
            </div>

            <h2>
                🎂 Welcome to the Birthday Vault
            </h2>

            <p>
                You actually knew the password...
                Interesting. 👀
            </p>


            <!--
                WELCOME VIDEO

                Put your video in the same folder as
                this HTML file.

                File name:
                welcome.mp4

                IMPORTANT:
                Video will attempt to play with sound.
            -->

            <video
                id="welcome-video"
                class="welcome-video"
                controls
                playsinline
            >

                <source
                    src="welcome.mp4"
                    type="video/mp4"
                >

                Your browser does not support video.

            </video>


            <button
                class="continue-button"
                onclick="closeWelcomeVideo()"
            >
                🎀 CONTINUE
            </button>

        </div>

    </div>



    <script src="script.js"></script>

</body>

</html>
