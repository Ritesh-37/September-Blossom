<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>A Little Birthday Secret 💗</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- BACKGROUND DECORATIONS -->
    <div class="background-decor">

        <span class="flower flower-1">✿</span>
        <span class="flower flower-2">✿</span>
        <span class="flower flower-3">✿</span>
        <span class="flower flower-4">✿</span>
        <span class="flower flower-5">✿</span>
        <span class="flower flower-6">✿</span>

        <span class="leaf leaf-1">🌿</span>
        <span class="leaf leaf-2">🍃</span>
        <span class="leaf leaf-3">🌿</span>
        <span class="leaf leaf-4">🍃</span>

    </div>


    <!-- MAIN PAGE -->
    <main class="page">

        <!-- LEFT SIDE -->
        <section class="photo-section">

            <div class="pink-layer"></div>
            <div class="white-layer"></div>

            <div class="decor-flower flower-left">✿</div>
            <div class="decor-flower flower-right">✿</div>

            <!-- HEART PHOTO -->
            <div class="heart-frame">

                <div class="heart-photo">

                    <!--
                    ==================================================
                    YOUR PHOTO GOES HERE

                    Later replace the URL with your own image.

                    Example:
                    src="media/myphoto.jpg"
                    ==================================================
                    -->

                    <img
                        src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=800&q=80"
                        alt="Birthday photo"
                    >

                </div>

            </div>

            <div class="photo-caption">
                <span>♡</span>
                A little piece of happiness
                <span>♡</span>
            </div>

        </section>


        <!-- RIGHT SIDE -->
        <section class="password-section">

            <div class="password-decoration">
                ♡
            </div>

            <p class="small-heading">
                A LITTLE SECRET AWAITS
            </p>

            <h1>
                Enter The Password
            </h1>

            <p class="subtitle">
                Only someone special knows the way in... 🌸
            </p>


            <!-- PASSWORD DISPLAY -->
            <div
                id="password-display"
                class="password-display"
            ></div>


            <!-- NUMERIC KEYPAD -->
            <div class="keypad">

                <button class="key" onclick="pressKey('1')">1</button>
                <button class="key" onclick="pressKey('2')">2</button>
                <button class="key" onclick="pressKey('3')">3</button>

                <button class="key" onclick="pressKey('4')">4</button>
                <button class="key" onclick="pressKey('5')">5</button>
                <button class="key" onclick="pressKey('6')">6</button>

                <button class="key" onclick="pressKey('7')">7</button>
                <button class="key" onclick="pressKey('8')">8</button>
                <button class="key" onclick="pressKey('9')">9</button>

                <button class="key special" onclick="deleteKey()">×</button>
                <button class="key" onclick="pressKey('0')">0</button>
                <button class="key special" onclick="checkPassword()">↵</button>

            </div>


            <p id="password-message" class="password-message"></p>

        </section>

    </main>


    <script src="script.js"></script>

</body>
</html>
