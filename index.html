<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Private Birthday Portal</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ================================
         PASSWORD PAGE
    ================================= -->

    <section id="password-page">

        <!-- LEFT SIDE -->
        <div class="left-side">

            <div class="photo-box">

                <!--
                ==========================================
                YOUR PHOTO GOES HERE

                Later, replace:

                media/my-photo.jpg

                with your actual image filename.

                Example:
                media/ritesh.jpg
                ==========================================
                -->

                <img
                    src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e"
                    alt="My Photo"
                >

            </div>

            <h1>
                Abey oh Chirkoot!!
            </h1>

            <p>
                Password Daal 😎
            </p>

        </div>


        <!-- RIGHT SIDE -->
        <div class="right-side">

            <div class="password-card">

                <div class="lock">
                    🔐
                </div>

                <div class="small-heading">
                    PRIVATE ACCESS
                </div>

                <h2>
                    Enter Password
                </h2>

                <p class="subtitle">
                    Only the chosen one may enter...
                </p>


                <!-- PASSWORD DISPLAY -->

                <div id="password-display">
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                    <span></span>
                </div>


                <!-- NUMERIC KEYPAD -->

                <div class="keypad">

                    <button onclick="pressNumber('1')">1</button>
                    <button onclick="pressNumber('2')">2</button>
                    <button onclick="pressNumber('3')">3</button>

                    <button onclick="pressNumber('4')">4</button>
                    <button onclick="pressNumber('5')">5</button>
                    <button onclick="pressNumber('6')">6</button>

                    <button onclick="pressNumber('7')">7</button>
                    <button onclick="pressNumber('8')">8</button>
                    <button onclick="pressNumber('9')">9</button>

                    <button class="empty-key"></button>

                    <button onclick="pressNumber('0')">0</button>

                    <button
                        class="delete-key"
                        onclick="deleteNumber()"
                    >
                        ⌫
                    </button>

                </div>


                <button
                    class="enter-button"
                    onclick="checkPassword()"
                >
                    ENTER ✦
                </button>


                <p id="password-message"></p>

            </div>

        </div>

    </section>



    <!-- ================================
         WRONG PASSWORD POPUP
    ================================= -->

    <div id="wrong-popup">

        <div class="wrong-card">

            <!--
            ==========================================
            TEMPORARY MEME IMAGE

            Later replace this with your meme:

            media/abey-saale.jpg
            ==========================================
            -->

            <img
                src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde"
                alt="Wrong password meme"
            >

            <h2>
                ABEY SAALE 😂
            </h2>

            <button onclick="closeWrongPopup()">
                Okay Okay 😭
            </button>

        </div>

    </div>



    <!-- ================================
         WELCOME VIDEO
    ================================= -->

    <div id="welcome-popup">

        <div class="welcome-card">

            <video
                id="welcome-video"
                controls
                playsinline
            >

                <!--
                ==========================================
                WELCOME VIDEO

                Later put your video here:

                media/welcome.mp4
                ==========================================
                -->

                <source
                    src="media/welcome.mp4"
                    type="video/mp4"
                >

            </video>

            <h2>
                Welcome... 👀
            </h2>

            <p>
                You actually knew the password.
            </p>

            <button onclick="continueToAdventure()">
                ENTER THE ADVENTURE 🎂
            </button>

        </div>

    </div>



    <!-- ================================
         ORIGINAL BIRTHDAY GAME
    ================================= -->

    <section
        id="game-screen"
        class="hidden"
    >

        <!--
        YOUR ORIGINAL BIRTHDAY ADVENTURE
        WILL GO HERE.

        For now this is just a placeholder.
        We will connect your existing
        birthday adventure in the next step.
        -->

        <div class="game-placeholder">

            <h1>
                🎂 Birthday Adventure
            </h1>

            <p>
                Welcome to the secret birthday world! 💗
            </p>

        </div>

    </section>


    <script src="script.js"></script>

</body>
</html>
